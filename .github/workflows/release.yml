name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # GitHub Environment with required reviewers: a person approves every release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Trusted publishing needs npm 11.5.1 or later; Node.js 22 ships with npm 10.
      - run: npm install -g npm@11
      # No token: npm exchanges the GitHub OIDC token. Provenance requires a public repository.
      - run: npm publish --provenance --access public
