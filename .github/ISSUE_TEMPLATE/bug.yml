name: Bug report / 不具合の報告
description: A problem with the designmark CLI, MCP server or Claude Code plugin. / CLI・MCP サーバー・プラグインの不具合
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Takedown requests for designs on designmark.jp are handled at https://designmark.jp/takedown/ — not here.
        掲載の削除依頼は Issue ではなく https://designmark.jp/takedown/ からお送りください。
  - type: input
    id: version
    attributes:
      label: designmark version / 版
      description: "Output of `npx designmark --version`"
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
        - Other / その他
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version / Node.js の版
      description: "Output of `node --version`"
      placeholder: "v22.14.0"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or MCP tool / 実行したコマンドか MCP のツール
      placeholder: "npx designmark search 化粧品 --mood elegant"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and exit code / 出力と終了コード
      description: Paste the full output. / 出力をすべて貼ってください。
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? / 期待した動作
